name: CD Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/comanda-digital

jobs:
  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: discovery-service
            context: backend/discovery-service
          - name: auth-service
            context: backend/auth-service
          - name: catalog-service
            context: backend/catalog-service
          - name: table-service
            context: backend/table-service
          - name: notification-service
            context: backend/notification-service
          - name: order-service
            context: backend/order-service
          - name: api-gateway
            context: backend/api-gateway
          - name: billing-service
            context: backend/billing-service
          - name: ifood-service
            context: backend/ifood-service
          - name: whatsapp-service
            context: backend/whatsapp-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: push-images
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd /opt/comanda-digital
            git pull origin main
            echo "JWT_SECRET=${{ secrets.JWT_SECRET }}" > .env
            docker compose pull
            docker compose up -d --remove-orphans
            docker system prune -f
