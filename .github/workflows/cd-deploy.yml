name: CD Deploy

on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ${{ github.repository_owner }}/comanda-digital

jobs:
  push-images:
    name: Push Docker Images
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - name: discovery-service
            context: backend/discovery-service
          - name: auth-service
            context: backend/auth-service
          - name: catalog-service
            context: backend/catalog-service
          - name: table-service
            context: backend/table-service
          - name: notification-service
            context: backend/notification-service
          - name: order-service
            context: backend/order-service
          - name: api-gateway
            context: backend/api-gateway
          - name: billing-service
            context: backend/billing-service
          - name: ifood-service
            context: backend/ifood-service
          - name: whatsapp-service
            context: backend/whatsapp-service

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_PREFIX }}-${{ matrix.name }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: ${{ matrix.context }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VITE_API_URL=${{ vars.VITE_API_URL }}
            VITE_WS_URL=${{ vars.VITE_WS_URL }}
            VITE_GOOGLE_CLIENT_ID=${{ secrets.GOOGLE_CLIENT_ID }}

  deploy:
    name: Deploy via SSH
    runs-on: ubuntu-latest
    needs: push-images
    if: github.ref == 'refs/heads/main'
    environment: production

    steps:
      - uses: actions/checkout@v4

      - name: Deploy to server
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5 — fixado por SHA: recebe a chave SSH da VPS
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          envs: JWT_SECRET
          # Rebuildar as ~11 imagens do zero na VPS passa fácil dos 10min
          # (default da action) quando o cache de build está frio.
          command_timeout: 40m
          script: |
            cd /opt/oia-a-conta-backend
            # Sem isso, qualquer comando que falhar no meio do script (ex:
            # docker compose up -d abaixo, quando travava no frontend) era
            # silenciosamente ignorado — o script seguia até o "docker
            # system prune -f" do final, que quase sempre funciona, e a
            # action reportava sucesso mesmo com o deploy real tendo falhado.
            set -e
            git pull origin main
            touch .env
            # Reescreve a linha em vez de sed com o secret interpolado no
            # próprio texto do script: um valor com "|" ou quebra de linha
            # (aconteceu) quebra a expressão do sed ("unterminated 's'
            # command"). grep -v + append funciona com qualquer conteúdo.
            grep -v '^JWT_SECRET=' .env > .env.tmp || true
            mv .env.tmp .env
            # O erro de sed acima só apareceu porque o secret tinha uma
            # quebra de linha no valor — remove isso aqui também, senão
            # vira uma linha extra quebrada no .env.
            echo "JWT_SECRET=$(printf '%s' "$JWT_SECRET" | tr -d '\r\n')" >> .env
            # O docker compose dá prioridade à variável do SHELL sobre o .env —
            # e a do shell é o secret cru (com a quebra de linha que o tr acima
            # remove). Sem o unset, os containers criados por este deploy ficavam
            # com uma chave JWT diferente dos criados fora dele (ex: "docker
            # compose up" manual na VPS), e o gateway recusava todo token emitido
            # pelo auth-service: qualquer login caía na hora (2026-10-16).
            unset JWT_SECRET
            # "frontend" fica de fora de propósito: a tag :latest desse
            # serviço nunca existiu no GHCR (o CD do repo frontend só
            # publica :main/:sha) — isso fazia "docker compose pull"/"up -d"
            # sem argumentos abortar inteiro, travando a atualização de
            # TODOS os outros serviços mesmo com o build deles OK. O site
            # real é servido pela Vercel, não por esse container (ver nota
            # no DEPLOY.md sobre essa ambiguidade).
            SERVICES="discovery-service redis postgres db-backup auth-service api-gateway notification-service table-service order-service billing-service catalog-service evolution-api ifood-service ollama whatsapp-service"
            docker compose pull $SERVICES
            docker compose build $SERVICES
            docker compose up -d --remove-orphans $SERVICES
            docker system prune -f
