# Limite de heap/memória padrão pros serviços Java — sem isso, cada JVM usa
# o teto padrão de 25% da RAM do HOST (não do container) como MaxHeapSize,
# bem mais do que qualquer um desses microsserviços realmente usa (uso real
# observado em produção: 234-412MB por serviço) — reusado via YAML anchor
# em cada serviço Java pra não repetir a string 10 vezes.
x-jvm-mem: &jvm_mem_limitada "-Xmx300m -Xss256k -XX:MaxMetaspaceSize=160m -XX:+UseSerialGC -XX:ReservedCodeCacheSize=64m"

networks:
  oia-net:
    driver: bridge

volumes:
  postgres_data:
  redis_data:
  ollama_data:

services:

  # ─────────────────────────────────────────────
  # PostgreSQL — banco único com múltiplos schemas
  # ─────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: oia-postgres
    environment:
      POSTGRES_USER: oiaconta
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: db_auth
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    # Sem porta pro host de propósito — só alcançável pelos serviços dentro da
    # rede oia-net. Pra inspecionar o banco localmente use `docker exec -it
    # oia-postgres psql -U oiaconta -d <schema>`.
    networks:
      - oia-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oiaconta -d db_auth"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # Redis — cache e sessões
  # ─────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: oia-redis
    # Sem porta pro host — redis roda sem senha, só deve ser alcançável dentro
    # da rede interna.
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────
  # OSRM — roteamento real por ruas, usado pro cálculo de frete por km e pra
  # sugestão de rota do entregador. Precisa dos dados pré-processados em
  # ./osrm-data — rode infra/osrm/prepare-data.ps1 (ou .sh) uma vez antes de
  # subir este serviço. Não é dependência obrigatória de nenhum outro serviço:
  # o order-service cai pra uma estimativa por linha reta se o OSRM estiver
  # fora do ar ou os dados ainda não tiverem sido preparados.
  # ─────────────────────────────────────────────
  osrm:
    image: osrm/osrm-backend
    container_name: oia-osrm
    profiles: ["osrm"]
    command: osrm-routed --algorithm mld --max-table-size 100 /data/brazil-latest.osrm
    volumes:
      - ./osrm-data:/data
    networks:
      - oia-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # Eureka Discovery Server
  # ─────────────────────────────────────────────
  discovery-service:
    build:
      context: ./backend/discovery-service
      dockerfile: Dockerfile
    container_name: oia-discovery
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
    # Sem porta pro host — o dashboard do Eureka não tem autenticação, fica só
    # acessível dentro da rede interna. Pra inspecionar localmente, use
    # `docker port oia-discovery` + túnel, ou reabra a porta temporariamente.
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8761/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Auth Service
  # ─────────────────────────────────────────────
  auth-service:
    build:
      context: ./backend/auth-service
      dockerfile: Dockerfile
    container_name: oia-auth
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_auth
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
      JWT_EXPIRATION: 86400000
      GMAIL_USERNAME: ${GMAIL_USERNAME:-}
      GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD:-}
      # Mesmo Client ID OAuth do frontend (VITE_GOOGLE_CLIENT_ID) — usado pra
      # validar o "audience" do ID token no login social.
      GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID:-}
      # Sem isso, o /actuator/health agrega o indicador de e-mail: se o SMTP
      # não estiver configurado (GMAIL_APP_PASSWORD vazio), o health fica DOWN
      # e derruba o healthcheck do container — travando toda a cadeia de
      # depends_on (billing-service, api-gateway) mesmo com o serviço no ar.
      MANAGEMENT_HEALTH_MAIL_ENABLED: "false"
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8081/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Catalog Service
  # ─────────────────────────────────────────────
  catalog-service:
    build:
      context: ./backend/catalog-service
      dockerfile: Dockerfile
    container_name: oia-catalog
    environment:
      TZ: America/Sao_Paulo
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_catalog
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      SPRING_DATA_REDIS_HOST: redis
      SPRING_DATA_REDIS_PORT: 6379
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8082/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Table Service
  # ─────────────────────────────────────────────
  table-service:
    build:
      context: ./backend/table-service
      dockerfile: Dockerfile
    container_name: oia-table
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_table
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8083/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Notification Service
  # ─────────────────────────────────────────────
  notification-service:
    build:
      context: ./backend/notification-service
      dockerfile: Dockerfile
    container_name: oia-notification
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      discovery-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8085/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Order Service
  # ─────────────────────────────────────────────
  order-service:
    build:
      context: ./backend/order-service
      dockerfile: Dockerfile
    container_name: oia-order
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_order
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
      # O OSRM local (serviço "osrm" abaixo, atrás do profile "osrm") precisa
      # dos dados processados via infra/osrm/prepare-data.ps1 antes de subir
      # (extract/partition/customize sobre o .osm.pbf — pode levar horas pro
      # Brasil inteiro) e hoje não está rodando. Enquanto isso, usa o servidor
      # público de demonstração do próprio projeto OSRM (gratuito, sem chave,
      # mas é "light usage" — não tem SLA/garantia de disponibilidade; pra
      # produção de verdade, processar uma região menor localmente é melhor).
      OSRM_URL: ${OSRM_URL:-https://router.project-osrm.org}
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      table-service:
        condition: service_healthy
      notification-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8084/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # WhatsApp Service
  # ─────────────────────────────────────────────
  whatsapp-service:
    build:
      context: ./backend/whatsapp-service
      dockerfile: Dockerfile
    container_name: oia-whatsapp
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_whatsapp
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
      EVOLUTION_API_URL: http://evolution-api:8080
      EVOLUTION_API_KEY: ${EVOLUTION_API_KEY:-oia_evolution_key_2024}
      EVOLUTION_INSTANCE_NAME: ${EVOLUTION_INSTANCE_NAME:-oiaaconta}
      EVOLUTION_WEBHOOK_URL: ${EVOLUTION_WEBHOOK_URL:-http://whatsapp-service:8086/webhook/evolution}
      EVOLUTION_WEBHOOK_SECRET: ${EVOLUTION_WEBHOOK_SECRET:-}
      FRONTEND_BASE_URL: ${FRONTEND_BASE_URL:-http://localhost}
      OLLAMA_API_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct}
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8086/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Ollama — IA local gratuita/open-source pro chatbot do WhatsApp interpretar
  # pedidos em texto livre (nome de produto, endereço e forma de pagamento
  # misturados numa mensagem só). Primeira subida baixa o modelo (~1GB pro
  # 1.5b, poucos minutos) e fica em cache no volume ollama_data. qwen2.5:1.5b
  # é o default por rodar rápido mesmo com a máquina sob carga (testado: o 7b
  # e até o 3b passaram de 90s por mensagem numa máquina com só ~5.6GB de RAM
  # pro Docker Desktop e outros containers concorrendo por CPU) — com
  # mais RAM/CPU livres, dá pra trocar OLLAMA_MODEL pra qwen2.5:3b-instruct ou
  # 7b-instruct no .env pra ganhar precisão na extração.
  # ─────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: oia-ollama
    # Teto de segurança — sem isso, o processo do Ollama pode crescer sem
    # limite e derrubar o host inteiro (não só esse container) num servidor
    # com pouca RAM livre. Se bater o teto, o container morre (OOMKilled) e
    # reinicia sozinho (restart: unless-stopped abaixo), em vez de travar a
    # VPS toda.
    mem_limit: 1200m
    restart: unless-stopped
    entrypoint: ["/bin/sh", "-c"]
    command: >
      "ollama serve &
      sleep 5 &&
      ollama pull ${OLLAMA_MODEL:-qwen2.5:1.5b-instruct} &&
      wait"
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s

  # ─────────────────────────────────────────────
  # iFood Service — recebimento de pedidos, sincronização de cardápio e de
  # status da loja com o iFood. IFOOD_CLIENT_ID/SECRET são da aplicação
  # (cadastro único no portal de desenvolvedores do iFood, não por
  # restaurante) — cada restaurante ainda vincula a própria loja via
  # /api/ifood/admin/vincular.
  # ─────────────────────────────────────────────
  ifood-service:
    build:
      context: ./backend/ifood-service
      dockerfile: Dockerfile
    container_name: oia-ifood
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_ifood
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
      IFOOD_API_URL: ${IFOOD_API_URL:-https://merchant-api.ifood.com.br}
      IFOOD_CLIENT_ID: ${IFOOD_CLIENT_ID:-}
      IFOOD_CLIENT_SECRET: ${IFOOD_CLIENT_SECRET:-}
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8089/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Billing Service
  # ─────────────────────────────────────────────
  billing-service:
    build:
      context: ./backend/billing-service
      dockerfile: Dockerfile
    container_name: oia-billing
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/db_billing
      SPRING_DATASOURCE_USERNAME: oiaconta
      SPRING_DATASOURCE_PASSWORD: ${POSTGRES_PASSWORD}
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
      MP_ACCESS_TOKEN: ${MP_ACCESS_TOKEN:-}
      MP_WEBHOOK_SECRET: ${MP_WEBHOOK_SECRET:-}
      AUTH_SERVICE_URL: http://auth-service:8081
    # Sem porta pro host — só alcançável via api-gateway.
    depends_on:
      postgres:
        condition: service_healthy
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8088/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Evolution API (WhatsApp Gateway)
  # ─────────────────────────────────────────────
  evolution-api:
    build:
      context: ./evolution-patch
      dockerfile: Dockerfile
    container_name: oia-evolution
    environment:
      TZ: America/Sao_Paulo
      SERVER_PORT: 8080
      AUTHENTICATION_API_KEY: ${EVOLUTION_API_KEY:-oia_evolution_key_2024}
      DATABASE_ENABLED: "true"
      DATABASE_PROVIDER: postgresql
      DATABASE_CONNECTION_URI: postgresql://oiaconta:${POSTGRES_PASSWORD}@postgres:5432/db_evolution?schema=public
      DATABASE_CONNECTION_CLIENT_NAME: oia-evolution
      DATABASE_SAVE_DATA_INSTANCE: "true"
      DATABASE_SAVE_DATA_NEW_MESSAGE: "false"
      DATABASE_SAVE_MESSAGE_UPDATE: "false"
      DATABASE_SAVE_DATA_CONTACTS: "true"
      DATABASE_SAVE_DATA_CHATS: "true"
      DATABASE_SAVE_DATA_LABELS: "false"
      DATABASE_SAVE_DATA_HISTORIC: "false"
      CACHE_REDIS_ENABLED: "true"
      CACHE_REDIS_URI: redis://oia-redis:6379/6
      CACHE_REDIS_PREFIX_KEY: evolution
      CACHE_REDIS_SAVE_INSTANCES: "false"
      CACHE_LOCAL_ENABLED: "false"
      QRCODE_LIMIT: "30"
      QRCODE_EXPIRESIN: "45"
      CONFIG_SESSION_PHONE_CLIENT: "Evolution API"
      CONFIG_SESSION_PHONE_NAME: "Chrome"
      CONFIG_SESSION_PHONE_VERSION: ""
    # Sem porta pro host — só alcançável pelo whatsapp-service, dentro da rede
    # interna.
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - oia-net
    restart: unless-stopped

  # ─────────────────────────────────────────────
  # API Gateway
  # ─────────────────────────────────────────────
  api-gateway:
    build:
      context: ./backend/api-gateway
      dockerfile: Dockerfile
    container_name: oia-gateway
    environment:
      JAVA_TOOL_OPTIONS: *jvm_mem_limitada
      TZ: America/Sao_Paulo
      EUREKA_CLIENT_SERVICEURL_DEFAULTZONE: http://discovery-service:8761/eureka/
      JWT_SECRET: ${JWT_SECRET:-oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS:-http://localhost,http://localhost:80,http://localhost:3000,https://oiaaconta.com.br,https://*.oiaaconta.com.br}
    ports:
      - "8090:8080"
    depends_on:
      discovery-service:
        condition: service_healthy
      auth-service:
        condition: service_healthy
    networks:
      - oia-net
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:8080/actuator/health"]
      interval: 15s
      timeout: 5s
      retries: 8

  # ─────────────────────────────────────────────
  # Frontend (Nginx)
  # ─────────────────────────────────────────────
  # Imagem publicada pelo CD do repositório oia-a-conta-frontend
  # (build local não é mais possível aqui após a separação dos repos).
  frontend:
    image: ghcr.io/mmartirio/comanda-digital-frontend:${FRONTEND_IMAGE_TAG:-latest}
    container_name: oia-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api-gateway
    networks:
      - oia-net
