server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**, /api/restaurantes/**, /api/usuarios/**

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/categorias/**, /api/produtos/**

        - id: table-service
          uri: lb://table-service
          predicates:
            - Path=/api/mesas/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/comandas/**, /api/pedidos/**

        - id: notification-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

      globalcors:
        cors-configurations:
          '[/**]':
            allowedOriginPatterns: "*"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:comanda_digital_super_secret_key_2024_must_be_at_least_32_chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
