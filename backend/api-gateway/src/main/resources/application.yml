server:
  port: 8080

spring:
  application:
    name: api-gateway
  cloud:
    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        - id: auth-service
          uri: lb://auth-service
          predicates:
            - Path=/api/auth/**, /api/restaurantes/**, /api/usuarios/**, /api/grupos/**

        - id: catalog-publico
          uri: lb://catalog-service
          predicates:
            - Path=/api/catalog/publico/**

        - id: catalog-service
          uri: lb://catalog-service
          predicates:
            - Path=/api/categorias/**, /api/produtos/**, /api/clientes/**, /api/grupos-clientes/**, /api/estoque/**, /api/combos/**, /api/cupons/**, /api/promocoes/**

        # Precisa vir ANTES de table-service: POST/GET /api/mesas/{id}/comanda
        # é implementado no order-service (abrir/buscar comanda da mesa), não
        # no table-service — sem essa rota mais específica primeiro, o
        # predicate genérico de table-service abaixo engolia a chamada e
        # devolvia 403 (sem handler pro path, mas ainda autenticado).
        - id: mesa-comanda
          uri: lb://order-service
          predicates:
            - Path=/api/mesas/*/comanda

        - id: table-service
          uri: lb://table-service
          predicates:
            - Path=/api/mesas/**

        - id: billing-financeiro
          uri: lb://billing-service
          predicates:
            - Path=/api/financeiro/billing/**

        - id: billing-service
          uri: lb://billing-service
          predicates:
            - Path=/api/planos/**, /api/contratos/**, /api/tickets/**, /api/auditoria/**, /api/links-sociais/**, /api/pagamentos/**

        - id: order-service
          uri: lb://order-service
          predicates:
            - Path=/api/comandas/**, /api/pedidos/**, /api/entregas/**, /api/configuracoes/**, /api/financeiro/**, /api/pdv/**, /api/despesas/**, /api/caixa/**

        - id: whatsapp-service
          uri: lb://whatsapp-service
          predicates:
            - Path=/api/whatsapp/**, /webhook/**

        - id: ifood-service
          uri: lb://ifood-service
          predicates:
            - Path=/api/ifood/**

        - id: notification-ws
          uri: lb:ws://notification-service
          predicates:
            - Path=/ws/**

      default-filters:
        - DedupeResponseHeader=Access-Control-Allow-Origin Access-Control-Allow-Credentials, RETAIN_FIRST

      globalcors:
        cors-configurations:
          '[/**]':
            # Lista real de origens permitidas (não "*") — combinado com
            # allowCredentials:true, um coringa refletiria qualquer Origin de
            # volta, anulando a proteção do CORS. Vem de ALLOWED_ORIGINS no
            # .env/docker-compose.yml (separado por vírgula).
            allowedOriginPatterns: ${ALLOWED_ORIGINS:http://localhost}
            allowedMethods:
              - GET
              - POST
              - PUT
              - PATCH
              - DELETE
              - OPTIONS
            allowedHeaders: "*"
            allowCredentials: true

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway
