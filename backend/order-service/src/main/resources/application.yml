server:
  port: 8084

spring:
  application:
    name: order-service
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/db_order}
    username: ${SPRING_DATASOURCE_USERNAME:comanda}
    password: ${SPRING_DATASOURCE_PASSWORD:comanda123}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true
    baseline-version: 1
    baseline-description: "baseline (schema inferido das entidades JPA)"

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_CLIENT_SERVICEURL_DEFAULTZONE:http://localhost:8761/eureka/}
  instance:
    prefer-ip-address: true

jwt:
  secret: ${JWT_SECRET:oia_a_conta_super_secret_key_2024_must_be_at_least_32_chars}

osrm:
  url: ${OSRM_URL:http://localhost:5000}

feign:
  client:
    config:
      default:
        connectTimeout: 5000
        readTimeout: 10000
      # Timeout mais curto pro OSRM — se ele estiver fora do ar, o
      # FreteService cai pro fallback Haversine rápido em vez de segurar a
      # criação do pedido pelos 10s do timeout padrão.
      osrm:
        connectTimeout: 2000
        readTimeout: 3000

management:
  endpoints:
    web:
      exposure:
        include: health,info
